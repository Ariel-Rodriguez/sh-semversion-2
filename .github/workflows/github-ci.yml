name: CI
run-name: Checks
on: [push, pull_request]

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.test-shell }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            test-shell: sh
          - os: ubuntu-latest
            test-shell: dash
          - os: ubuntu-latest
            test-shell: bash
          - os: macos-latest
            test-shell: sh
          - os: windows-latest
            test-shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Test CLI comparisons
        shell: bash
        env:
          TEST_SHELL: ${{ matrix.test-shell }}
        run: sh ./test.sh print-only-failures

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check POSIX shell scripts
        run: shellcheck semver2.sh test.sh
